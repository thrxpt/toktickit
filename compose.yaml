name: toktickit

services:
  db:
    image: postgres:17-alpine
    container_name: toktickit-db
    restart: unless-stopped
    # Credentials are never committed — this reads the git-ignored server/.env,
    # the same file Prisma and Express read, so the two can never drift apart.
    env_file: ./server/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

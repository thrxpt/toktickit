packages:
  - client
  - server

# pnpm blocks postinstall scripts unless a package is allowed here.
# Prisma generates its client and esbuild fetches its binary in postinstall,
# so both must be allowed or `pnpm install` leaves a broken tree.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
